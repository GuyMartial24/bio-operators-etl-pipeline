# Services Docker du projet.
# Lancement : docker compose up -d   |   Arrêt : docker compose down
# Les valeurs ${...} viennent du fichier .env (jamais publié sur GitHub).

services:
  postgres:
    image: postgres:17
    container_name: bio_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Mots de passe des rôles applicatifs, lus par sql/init/01_roles.sh
      ETL_WRITER_PASSWORD: ${ETL_WRITER_PASSWORD}
      BI_READER_PASSWORD: ${BI_READER_PASSWORD}
      QA_READER_PASSWORD: ${QA_READER_PASSWORD}
      # Mot de passe du rôle airflow, lu par sql/init/09_airflow.sh
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      TZ: Europe/Paris
    ports:
      # Accessible uniquement depuis ce PC (127.0.0.1), pas depuis le réseau
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    volumes:
      # Les données sont gardées dans un volume Docker : elles survivent à l'arrêt du conteneur
      - pgdata:/var/lib/postgresql/data
      # Scripts exécutés une seule fois, à la création de la base (ro = lecture seule)
      - ./sql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Plafond de mémoire : le conteneur ne peut pas priver les autres services de la machine
    mem_limit: ${POSTGRES_MEMOIRE:-1g}

  # Orchestrateur : lance chaque jour les jobs Talend exportés (talend/build), dans l'ordre.
  # Interface web : http://localhost:<AIRFLOW_PORT> (8080 par défaut ; tunnel SSH sur un serveur)
  airflow:
    build: ./airflow
    image: bio-airflow:3.3.2
    container_name: bio_airflow
    restart: unless-stopped
    command: standalone
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@postgres:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DEFAULT_TIMEZONE: Europe/Paris
      TALEND_CONTEXTE: /opt/talend/contexte_docker.properties
      # Mot de passe de l'interface conservé hors du conteneur (sinon régénéré à chaque recréation)
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/auth/passwords.json
      # Notebook de contrôle qualité : connexion à la base avec le rôle qa_reader
      PG_HOTE: postgres
      QA_READER_PASSWORD: ${QA_READER_PASSWORD}
      TZ: Europe/Paris
    ports:
      # Port de la machine réglable (AIRFLOW_PORT), toujours limité à 127.0.0.1
      - "127.0.0.1:${AIRFLOW_PORT:-8080}:8080"
    # Airflow, ses processus et les jobs Java (jusqu'à 1 Go chacun, deux en parallèle)
    mem_limit: ${AIRFLOW_MEMOIRE:-4g}
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs
      - ./talend/build:/opt/talend/jobs:ro
      - ./talend/contexte_docker.properties:/opt/talend/contexte_docker.properties:ro
      - ./data:/opt/airflow/data
      - ./notebooks:/opt/airflow/notebooks:ro
      - airflow_auth:/opt/airflow/auth

volumes:
  pgdata:
  airflow_logs:
  airflow_auth:
