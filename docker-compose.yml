# Services Docker du projet.
# Lancement : docker compose up -d   |   Arrêt : docker compose down
# Les valeurs ${...} viennent du fichier .env (jamais publié sur GitHub).

services:
  postgres:
    image: postgres:17
    container_name: bio_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Mots de passe des rôles applicatifs, lus par sql/init/01_roles.sh
      ETL_WRITER_PASSWORD: ${ETL_WRITER_PASSWORD}
      BI_READER_PASSWORD: ${BI_READER_PASSWORD}
      QA_READER_PASSWORD: ${QA_READER_PASSWORD}
      # Mot de passe du rôle airflow, lu par sql/init/09_airflow.sh
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      TZ: Europe/Paris
    ports:
      # Accessible uniquement depuis ce PC (127.0.0.1), pas depuis le réseau
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    volumes:
      # Les données sont gardées dans un volume Docker : elles survivent à l'arrêt du conteneur
      - pgdata:/var/lib/postgresql/data
      # Scripts exécutés une seule fois, à la création de la base (ro = lecture seule)
      - ./sql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
