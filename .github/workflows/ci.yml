# Intégration continue : à chaque push, on vérifie que la base se crée correctement.
name: CI

# Flux de travail : on pousse sur develop, puis on ouvre une pull request (PR) de develop vers main.
on:
  push:
    branches: [develop, main]   # chaque push sur develop, et main après la fusion d'une PR
  pull_request:
    branches: [main]            # chaque PR vers main : la CI doit être verte avant de fusionner

# Si on pousse deux fois de suite, on annule l'exécution précédente devenue inutile
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database:
    name: Base PostgreSQL (schémas, rôles, droits)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v4

      - name: Créer un .env de test (mots de passe aléatoires, jetables)
        run: |
          cp .env.example .env
          for var in POSTGRES_PASSWORD ETL_WRITER_PASSWORD BI_READER_PASSWORD QA_READER_PASSWORD AIRFLOW_DB_PASSWORD; do
            sed -i "s/^${var}=.*/${var}=$(openssl rand -hex 16)/" .env
          done

      - name: Vérifier la syntaxe de docker-compose.yml
        run: docker compose config --quiet

      - name: Démarrer PostgreSQL et attendre qu'il soit prêt
        # Seulement le service postgres : Airflow n'est pas nécessaire pour tester la base
        run: docker compose up -d --wait postgres

      - name: Lancer les tests de la base
        run: |
          set -a; source .env; set +a
          docker compose exec -T postgres \
            psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 \
            < sql/tests/test_init.sql

      - name: Afficher les logs de PostgreSQL en cas d'échec
        if: failure()
        run: docker compose logs postgres

      - name: Arrêter et supprimer les conteneurs
        if: always()
        run: docker compose down -v

  python:
    name: Code Python et DAG Airflow
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v4

      - name: Installer Python 3.12 (la version de l'image Airflow)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les outils de vérification (versions figées)
        run: pip install ruff==0.17.2 nbformat==5.11.1

      - name: Vérifier les règles de style et les erreurs Python (ruff, ruff.toml)
        run: ruff check airflow powerbi/cartes notebooks/qualite

      - name: Vérifier le notebook de contrôle qualité
        run: python notebooks/qualite/verifier_notebook.py notebooks/qualite/controle_qualite.ipynb

      - name: Charger le DAG dans Airflow 3.3.2 et vérifier ses tâches et dépendances
        # Image officielle, même version que l'image du projet ; le DAG est lu, pas exécuté.
        run: |
          docker run --rm -e AIRFLOW__CORE__LOAD_EXAMPLES=False \
            -v "$PWD/airflow:/opt/projet:ro" apache/airflow:3.3.2-python3.12 \
            python /opt/projet/tests/test_dag.py /opt/projet/dags
